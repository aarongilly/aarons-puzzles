<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Med Kit — Puzzle Box</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #e7e9ed; }
      #scene { display: block; width: 100%; height: 80%; touch-action: none; }
      #hud { display: block; width: 100%; height: 20%; touch-action: none; }
      #failure { position: absolute; inset: 15% 8% auto; padding: 24px; background: white; color: #242424; font: 18px/1.5 Arial, sans-serif; }
      .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
      [hidden] { display: none !important; }
    </style>
    <script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>
    <script type="module" src="bootstrap.js"></script>
  </head>
  <body>
    <canvas id="scene" width="900" height="480" tabindex="0" aria-label="3D puzzle box. Drag to orbit; right-drag or two-finger drag to pan; scroll or pinch to zoom. Canvas buttons focus the box, lid, or panel. Use U to unlock the placeholder code 000, L to slide the lid, F to flip the removed lid, P to remove or return the panel, V to reset the view, and R to reset the demo. Keys 1, 2, and 3 cycle the lock digits."></canvas>
    <canvas id="hud" width="900" height="120" aria-label="Puzzle box controls. Click the drawn controls or use the scene's keyboard shortcuts."></canvas>
    <p id="status" class="sr-only" role="status"></p>
    <p id="failure">Loading the puzzle box… If this message remains, serve the project over HTTP instead of opening index.html directly.</p>
  </body>
</html>
