<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Med Kit — Puzzle Box</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #e7e9ed; }
      #scene { display: block; width: 100%; height: 86.666667%; touch-action: none; }
      #hud { display: block; width: 100%; height: 13.333333%; touch-action: none; }
      #failure { position: absolute; inset: 15% 8% auto; padding: 24px; background: white; color: #242424; font: 18px/1.5 Arial, sans-serif; }
      .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
      [hidden] { display: none !important; }
    </style>
    <script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>
    <script type="module" src="bootstrap.js"></script>
  </head>
  <body>
    <canvas id="scene" width="900" height="520" tabindex="0" aria-label="Med kit. Drag to orbit and pinch or scroll to zoom. Tap an object to focus, or tap its controls. Open the box to use the medical assistant's Left, Right, Up, Down and Enter buttons. Tap the dispensed bandage to collect it. Arrow keys and Enter also control the assistant."></canvas>
    <canvas id="hud" width="900" height="80" aria-label="Explore house. Return to the house without losing med-kit progress."></canvas>
    <p id="status" class="sr-only" role="status"></p>
    <p id="failure">Loading the puzzle box… If this message remains, serve the project over HTTP instead of opening index.html directly.</p>
  </body>
</html>
